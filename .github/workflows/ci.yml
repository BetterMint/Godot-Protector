name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Test
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Smoke build + verify
        run: |
          gdprotect --seed 1 build tests/fixture -o /tmp/t.gdpk --no-obfuscate | tee /tmp/smoke.log
          KEY=$(grep -oP 'build key \(keep secret\): \K[0-9a-f]+' /tmp/smoke.log)
          test -n "$KEY"
          gdprotect verify /tmp/t.gdpk --key "$KEY"
